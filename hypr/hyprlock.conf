general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot        # blurred screenshot of your session
    blur_passes = 3
    blur_size = 6
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 64
    position = 0, 80
    halign = center
    valign = center
}
