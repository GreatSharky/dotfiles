general {
    lock_cmd = pidof hyprlock || hyprlock     # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session  # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # to avoid having to press a key twice to turn on the display.
}

# dim the screen minute before locking
listener {
    timeout = 240
    on-timeout = brightnessctl -s set 100
    on-resume = brightnessctl -r
}

# turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
listener {
    timeout = 150                                           # 2.5min.
    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0  # turn off keyboard backlight.
    on-resume = brightnessctl -rd rgb:kbd_backlight         # turn on keyboard backlight.
}

# Lock the session
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn the screen off when timeout has passed
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r
}

# At 30min suspend pc
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
