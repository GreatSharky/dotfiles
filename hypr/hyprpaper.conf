# Hyprpaper config. See https://wiki.hypr.land/Hypr-Ecosystem/hyprpaper/

wallpaper {
    # Empty monitor applies to all monitors.
    monitor =

    # Directory of images. A random image is chosen from it.
    # TODO: replace with the real wallpaper directory.
    path = ~/Images/wallpapers/

    fit_mode = cover

    # Uncomment to pick a new random image every N seconds.
    # timeout = 600
}
